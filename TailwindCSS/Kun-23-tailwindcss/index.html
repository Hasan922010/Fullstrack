<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <title>Spacing va Sizing</title>
    <!-- Tailwind CDN — bir qator bilan butun framework yuklandi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <h1>Tailwindcss 2-dars:Spacing va Sizing</h1>
    <!-- Sahifa o'rtasida karta -->
     <h2>1-Vazifa</h2>
     <div class="min-h-screen bg-gray-100 py-12">
        <!-- Karta - markazda, max kenglik cheklangan -->
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6
        space-y-4">
            <!-- space-y-4 har element orasida 16px qo'yadi -->

            <h2 class="text-2xl font-bold text-gray-800">Yangi xabar</h2>
            <p class="text-gray-600">Sizga yangi xabar keldi. Iltimos, uni o'qib chiqing va javob bering</p>
            <button class="w-full px-4 py-3  bg-blue-500 hover:bg-blue-700 text-white rounded-lg transition">Xabarni ochish</button>
        </div>
     </div>

</body>
</html>
