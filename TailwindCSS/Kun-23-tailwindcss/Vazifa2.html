<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifa 2</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">
    <!-- Yuqoridagi nav panel -->
    <nav class="bg-white shadow-md py-4">
        <!-- Container - markazda, kenglik cheklangan -->
        <div class=" msx-w-7xl mx-auto px-6 flex justify-between" items-center items-center>
            <!-- logo -->
            <div class="text-2xl font-bold text-blue-600">
                MySite
            </div>
            <!-- Linklar - flex va space-x bilan -->
            <div class="flex space-x-6">
                <a href="#" class="text-gray-700 hover:text-blue-600">Bosh sahifa</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">Xizmatlar</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">Biz haqimizda</a>
                <a href="#" class="text-gray-700 hover:text-blue-600">Bog'lanish</a>
            </div>
        </div>

    </nav>

    <h2 class="text-center text-3xl">Vazifa 3</h2>

    <div class="min-h-screen bg-gray-100 py-12">
        <!-- Sahifa container -->
        <div class="max-w-7xl mx-auto px-6">
            <!-- Sarlavha -->
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Boshqaruv paneli</h1>
            <!-- 3 ta karta - yonma-yon -->
            <div class="flex space-x-4">
                <!-- Karta 1: Foydalanuvchilar -->
                <div class="flex-1 bg-white rounded-lg shadow p-6">
                    <p class="text-gray-500 text-sm">Foydalanuvchilar</p>
                    <p class="text-3xl font-bold text-gray-800" mt-2>1.248</p>
                    <p class="text-green-500 text-sm mt-2"> ↑ 12% bu oy</p>
                </div>
                <!-- Karta 2: Daromad -->
                 <div class="flex-1 bg-white rounded-lg shadow p-6">
                    <p class="text-gray-500 text-sm">Daromad</p>
                    <p class="text-3xl font-bold text-gray-800" mt-2>$54,200</p>
                    <p class="text-green-500 text-sm mt-2">↑ 8% bu oy</p>
                 </div>

                <!-- Karta 3: Buyurtmalar -->
                 <div class="flex-1 bg-white rounded-lg shadow p-6">
                    <p class="text-gray-500 text-sm">Buyurmalar</p>
                    <p class="text-3xl font-bold text-gray-800" mt-2>324</p>
                    <p class="text-red-500 text-sm mt-2"> ↓ 3% bu oy</p>
                 </div>
            </div>
        </div>
    </div>
</body>

</html>
