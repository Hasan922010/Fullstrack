<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifa 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="min-h-screen bg-gray-100 p-6">
        <div class="max-w-7xl mx-auto">
            <!-- 4 ustunli grid -->
            <div class="grid grid-cols-4 gap-4">

                <!-- Sarlavha (butun kenglikda) -->
                <div class="col-span-full bg-white rounded-xl shadow p-6">
                    <h1 class="text-2xl font-bold text-gray-900">Boshqaruv paneli</h1>
                    <p class="text-gray-500 mt-1">Bugungi statistika</p>
                </div>
                <!-- Katta karta (2 ustun) -->
                <div class="col-span-2 bg-gradient-to-br from-blue-500 to-purple-600 text-white rounded-xl shadow p-6">
                    <p class="text-blue-100 text-sm uppercase tracking-widest">
                        Bugungi daromad
                    </p>
                    <p class="text-4xl font-bold mt-3">$12,540</p>
                    <p class="text-blue-100 mt-2">↑ 18% kechagidan</p>
                </div>
                <!-- Kichik karta 1 -->
                <div class="bg-white rounded-xl shadow p-4">
                    <p class="text-gray-500 text-xs uppercase tracking-widest">Buyurtmalar</p>
                    <p class="text-2xl font-bold text-gray-900 mt-2">324</p>
                </div>

                <!-- Kichik karta 2 -->
                <div class="bg-white rounded-xl shadow p-4">
                    <p class="text-gray-500 text-xs uppercase tracking-widest">Mijozlar</p>
                    <p class="text-2xl font-bold text-gray-900 mt-2">1,248</p>
                </div>

                <!-- Grafik (butun kenglikda) -->
                 <div class="col-span-full bg-white rounded-xl shadow p-6">
                    <h3 class="font-bold text-gray-900 mb-4">Hafta bo'yicha sotuvlar</h3>
                    <!-- Soxta grafik -->

                    <div class="flex items-end gap-2 h-40">
                        <div class="bg-blue-500 rounded-t flex-1" style="height:60%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:80%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:45%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:90%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:70%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:55%;"></div>
                        <div class="bg-blue-500 rounded-t flex-1" style="height:85%;"></div>
                    </div>
                 </div>
            </div>
        </div>
    </div>

</body>

</html>
