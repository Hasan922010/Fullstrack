<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <title>Salom Tailwind</title>
    <!-- Tailwind CDN — bir qator bilan butun framework yuklandi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- min-h-screen: balandligi ekran balandligida -->
    <!-- flex + items-center + justify-center: ichidagi narsani markazga qo'yadi -->
    <!-- bg-gray-100: och-kulrang fon -->
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <!-- text-5xl: juda katta matn (3rem ~ 48px) -->
        <!-- font-bold: qalin -->
        <!-- text-blue-600: ko'k rang -->
        <h1 class="text-5xl font-bold text-blue-600">
            Salom, Tailwind!
        </h1>
    </div>
    <h2>2-vazifa</h2>

    <button class="
        bg-blue-500
        hover:bg-blue-700
        text-white
        font-semibold
        px-6
        py-3
        rounded-lg
        transition
        duration-300
        
    ">Ro'yxatdan o'tish</button>
</body>

</html>
