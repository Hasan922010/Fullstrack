<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holatlar va Effektlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h2 class="text-center text-3xl font-bold">Vazifa 1</h2>
    <div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
        <div class="space-y-4">
    
            <!-- 1. Primary -->
            <button class="
          block w-64
          bg-blue-500 hover:bg-blue-700 active:bg-blue-900
          text-white font-semibold
          px-6 py-3 rounded-lg
          focus:outline-none focus:ring-4 focus:ring-blue-200
          active:scale-95
          transition duration-200
        ">
                Asosiy tugma
            </button>
    
            <!-- 2. Secondary -->
            <button class="
          block w-64
          bg-gray-200 hover:bg-gray-300 active:bg-gray-400
          text-gray-800 font-semibold
          px-6 py-3 rounded-lg
          focus:outline-none focus:ring-4 focus:ring-gray-300
          active:scale-95
          transition duration-200
        ">
                Yordamchi tugma
            </button>
    
            <!-- 3. Outline -->
            <button class="
          block w-64
          border-2 border-blue-500 text-blue-500
          hover:bg-blue-500 hover:text-white
          active:bg-blue-700
          font-semibold px-6 py-3 rounded-lg
          focus:outline-none focus:ring-4 focus:ring-blue-200
          active:scale-95
          transition duration-200
        ">
                Chegarali tugma
            </button>
    
            <!-- 4. Disabled -->
            <button disabled class="
            block w-64
            bg-blue-500 hover:bg-blue-700
            disabled:bg-gray-300 disabled:cursor-not-allowed
            text-white font-semibold
            px-6 py-3 rounded-lg
            transition
          ">
                O'chirilgan tugma
            </button>
    
        </div>
    </div>

    <h2 class="text-center text-3xl font-bold">Vazifa 2</h2>

    <div class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
    
        <!-- "group" class - bu ota element -->
        <div class="
        group
        max-w-sm bg-white hover:bg-blue-600
        rounded-2xl shadow hover:shadow-2xl
        p-6 cursor-pointer
        hover:-translate-y-2
        transition duration-300
      ">
    
            <!-- Kategoriya yorlig'i -->
            <p class="
          text-xs font-bold uppercase tracking-widest
          text-blue-600 group-hover:text-blue-200
          transition
        ">
                Frontend
            </p>
    
            <!-- Sarlavha -->
            <h2 class="
          text-2xl font-bold mt-3
          text-gray-900 group-hover:text-white
          transition
        ">
                Tailwind CSS sirlari
            </h2>
    
            <!-- Tavsif -->
            <p class="
          mt-3 leading-relaxed
          text-gray-600 group-hover:text-blue-100
          transition
        ">
                Sahifangizni 5 marta tezroq yozish uchun professional usullar.
            </p>
    
            <!-- "O'qish" havolasi -->
            <p class="
          mt-4 font-semibold flex items-center gap-2
          text-blue-600 group-hover:text-white
          transition
        ">
                <span>O'qish</span>
                <span class="
            group-hover:translate-x-2
            transition duration-300
          ">⟶</span>
            </p>
    
        </div>
    </div>

        <h2 class="text-center text-3xl font-bold">Vazifa 3</h2>

        <div class="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center p-6">
        
            <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md space-y-6">
        
                <!-- Sarlavha -->
                <div class="text-center">
                    <h1 class="text-3xl font-bold text-gray-900">Tizimga kirish</h1>
                    <p class="text-gray-500 mt-2">Profilingizga kirib, davom eting</p>
                </div>
        
                <!-- Email input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Email manzil
                    </label>
                    <input type="email" placeholder="sizning@email.com" class="
                  w-full px-4 py-3
                  border border-gray-300 rounded-lg
                  placeholder:text-gray-400
                  focus:outline-none
                  focus:border-blue-500
                  focus:ring-4 focus:ring-blue-100
                  transition duration-200
                ">
                </div>
        
                <!-- Parol input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Parol
                    </label>
                    <input type="password" placeholder="••••••••" class="
                  w-full px-4 py-3
                  border border-gray-300 rounded-lg
                  placeholder:text-gray-400
                  focus:outline-none
                  focus:border-blue-500
                  focus:ring-4 focus:ring-blue-100
                  transition duration-200
                ">
                </div>
        
                <!-- Parolni unutdim -->
                <div class="text-right">
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                        Parolni unutdingizmi?
                    </a>
                </div>
        
                <!-- Tugma -->
                <button class="
              w-full
              bg-blue-500 hover:bg-blue-700 active:bg-blue-900
              text-white font-bold
              py-3 rounded-lg
              focus:outline-none focus:ring-4 focus:ring-blue-200
              active:scale-98
              transition duration-200
            ">
                    Kirish
                </button>
        
                <!-- Pastdagi havolalar -->
                <p class="text-center text-sm text-gray-600">
                    Hisobingiz yo'qmi?
                    <a href="#" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline">
                        Ro'yxatdan o'tish
                    </a>
                </p>
        
            </div>
        </div>

</body>
</html>
