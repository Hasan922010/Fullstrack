<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display turlari</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h2>1.display: block</h2>
    <div class="quti block-element">A (block)</div>
    <div class="quti block-element">B (block)</div>
    <div class="quti block-element">C (block)</div>

    <h2>2.display: inline</h2>
    <div class="quti blok-element">A (inline)</div>
    <div class="quti blok-element">B (inline)</div>
    <div class="quti blok-element">C (inline)</div>

    <h2>3.display: inline-block</h2>

    <div class="quti inlineblock-element">A (inline-block)</div>
    <div class="quti inlineblock-element">B (inline-block)</div>
    <div class="quti inlineblock-element">C (inline-block)</div>

    <h2>4.display: none</h2>
    <div class="quti none-element">BU element ko'rinmaydi!</div>
    <p>Yuqoridagi quti bor edi, lekin u <code>display: none</code> bilan yashirilgan</p>

    
</body>
</html>
