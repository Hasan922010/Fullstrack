<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazeta Layout</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="gazeta">
        <article class="bosh-maqola">
            <span class="kategoriya">TEXNOLOGIYA</span>
            <h1>Sun'iy intellekt 2026-yil qanday rivojlandi?</h1>
            <p>Sun'iy intellekt sohasidagi eng so'nggi yutuqlar va kelajakdagi imkoniyatlar haqida batafsil tahlil.</p>
        </article>
        
        <article class="kichik-1">
            <span class="kategoriya">SPORT</span>
            <h2>Yangi rekord o'rnatildi</h2>
        </article>
        
        <article class="kichik-2">
            <span class="kategoriya">SIYOSAT</span>
            <h2>Iqtisodiy yangiliklar</h2>
        </article>

        <article class="kichik-3">
            <span class="kategoriya">MADANIYAT</span>
            <h2>Yangi kitob chiqdi</h2>
        </article>

        <article class="kichik-4">
            <span class="kategoriya">FAN</span>
            <h2>Kosmik missiya muffaqiyatli</h2>
        </article>
    </div>
    
</body>
</html>
