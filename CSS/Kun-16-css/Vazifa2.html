<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Layout</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <h2 class="logo">🧑‍💻FlexApp</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="active">📊 Dashboard</a>
                <a href="#">📦 Mahsulotlar</a>
                <a href="#">👥 Mijozlar</a>
                <a href="#">📈 Statistika</a>
                <a href="#">⚙️ Sozlamalar</a>

            </nav>
            <div class="sidebar-bottom">
                👤 Xasan Aliyev
            </div>

        </aside>
        <!-- Kontent -->
         <main class="content">
            <header class="content-header">
                <h1>Dashboard</h1>
                <button class="new-btn">+ Yangi qoshish</button>

            </header>
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-label">JAMI MIJOZLAR</span>
                    <span class="stat-num">1,248</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">DAROMAD</span>
                    <span class="stat-num">$45.2K</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">BUYUTMALAR</span>
                    <span class="stat-num">389</span>
                </div>
            </div>
            <div class="info-block">
                <h2>So'ngi faollik</h2>
                <p>Sidebar qattiq, asosiy kontent qolgan joyni egallaydi-flex:1 sehri!</p>
            </div>

         </main>
    </div>
    
</body>
</html>
