<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox tanishuv</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h3>1. justify-content: flex-start (default)</h3>
    <div class="ota start">
        <div class="bola">A</div>
        <div class="bola">B</div>
        <div class="bola">C</div>
    </div>

    <h3>2. justify-content: center</h3>
    <div class="ota center">
        <div class="bola">A</div>
        <div class="bola">B</div>
        <div class="bola">C</div>
    </div>

    <h3>3. justify-content: space-between</h3>
    <div class="ota between">
        <div class="bola">A</div>
        <div class="bola">B</div>
        <div class="bola">C</div>
    </div>

    <h3>4. justify-content: space-around</h3>
    <div class="ota around">
        <div class="bola">A</div>
        <div class="bola">B</div>
        <div class="bola">C</div>
    </div>


</body>

</html>
