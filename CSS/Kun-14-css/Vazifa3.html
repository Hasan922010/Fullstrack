<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Oyna</title>
    <link rel="stylesheet" href="style3.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Sahifa kontenti</h1>
    <p>Bu odatiy sahifa. Modal oyna yuqoridan tushadi.</p>
    
    <!-- Modal-qoplama(overlay) -->
     <div class="modal-qoplama">
        <!-- Modal ichidagi kartochka -->
         <div class="modal-karta">
            <button class="yopish-tugma">x</button>

            <div class="modal-icon">📅</div>
            <h2>Xush kelibsiz!</h2>
            <p>Siz muvaffaqiyatli ro'yxatdan o'tdingiz. Endi barcha imkoniyarlardan foydalanishingiz mumkin.</p>
            <div class="modal-tugmalar">
                <button class="btn-asosiy">Boshlash</button>
                <button class="btn-ikkinchi">Keyinroq</button>
            </div>
         </div>
     </div>

    
</body>
</html>
